<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Game</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }

      .loader {
        text-align: center;
        opacity: 0.9;
      }

      .spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 14px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <div>Loading game...</div>
    </div>

    <script>
      const gameUrl = "https://playgama.com/export/game/brawl-simulator-3d?clid=p_dc935da8-22da-4d5c-a3a5-25ade6855652";
      window.location.replace(gameUrl);
    </script>
  </body>
</html>
