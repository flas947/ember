<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>ember — new tab</title>
</head>
<body>

<div class="browser">
  <aside class="sidebar" id="sidebar">
    <div class="chrome-row">
      <button class="chrome-btn" id="backBtn" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="chrome-btn" id="fwdBtn" title="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="chrome-btn" id="reloadBtn" title="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg></button>
      <span class="chrome-btn spacer"></span>
      <button class="chrome-btn" id="collapseBtn" title="Toggle sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
    </div>

    <div class="url-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="urlInput" type="text" placeholder="Search or enter URL">
    </div>

    <div class="pinned-row" id="pinnedRow"></div>

    <button class="new-tab-btn" id="newTabBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New tab
    </button>
    <div class="tab-list" id="tabList"></div>

    <div class="sidebar-bottom" id="bottomNav"></div>
  </aside>

  <main class="main">
    <div class="glow"></div>
    <div class="panel" id="panel"></div>
  </main>
</div>

<div id="modalRoot"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
